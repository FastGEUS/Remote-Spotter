name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.sum
      - name: Install Python dependencies
        run: python -m pip install -r remote/requirements.txt pyirsdk==1.3.7 asyncssh==2.24.1
      - name: Python tests
        run: python -m unittest discover -s remote/tests -v
      - name: JavaScript tests
        run: node --test remote/tests/*.test.cjs
      - name: Go tests
        working-directory: relay
        run: go test ./...
      - name: Go vet
        working-directory: relay
        run: go vet ./...
